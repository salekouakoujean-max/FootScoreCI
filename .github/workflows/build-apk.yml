
name: Build FootScore CI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          unzip -q FootScoreCI_Complete_1.1.0_recreated-3.zip -d source
          cp app/build.gradle.kts source/FootScoreCI_Complete_1.1.0_recreated/android/app/build.gradle.kts

      - name: Aligner Kotlin avec Google Ads
        run: |
          PROJECT="source/FootScoreCI_Complete_1.1.0_recreated/android"
          grep -RIl '2.0.21' "$PROJECT" --include='*.gradle.kts' --include='*.toml' | xargs -r sed -i 's/2.0.21/2.3.0/g'

      - name: Configurer l'adresse du serveur
        run: |
          PROJECT="source/FootScoreCI_Complete_1.1.0_recreated/android"
          HTML=$(find "$PROJECT/app/src/main/assets" -type f -name 'index.html' | head -n 1)
          test -n "$HTML"
          sed -i 's#https://YOUR-SERVER-DOMAIN.example#https://footscore-ci-server.onrender.com#g' "$HTML"

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compiler l'application
        working-directory: source/FootScoreCI_Complete_1.1.0_recreated/android
        run: gradle --no-daemon assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FootScore-CI-APK
          path: source/FootScoreCI_Complete_1.1.0_recreated/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error



