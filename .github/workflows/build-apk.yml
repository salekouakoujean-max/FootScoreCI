
name: Build FootScore CI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          unzip -q FootScoreCI_Complete_1.1.0_recreated-3.zip -d source
          echo "Projet extrait"

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compiler l'application
        working-directory: source/FootScoreCI_Complete_1.1.0_recreated/android
        run: gradle --no-daemon assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FootScore-CI-APK
          path: source/FootScoreCI_Complete_1.1.0_recreated/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


