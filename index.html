
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b35">
<title>FootScore CI</title>
<style>
:root{--navy:#071b35;--blue:#1265d8;--bg:#eef2f7;--text:#152238;--muted:#6b778c;--red:#d9303e;--line:#e4e9f1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(135deg,#071b35,#123f77);color:white;padding:22px 17px 18px}
.top{max-width:960px;margin:auto;display:flex;align-items:center;gap:12px}
.ball{font-size:35px}
header h1{font-size:25px;margin:0 0 5px}
header p{margin:0;color:#d7e7ff;font-size:14px}
main{max-width:960px;margin:auto;padding:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:11px 15px;background:white;color:#344054;font-weight:700;font-size:14px}
.tabs button.active{background:var(--blue);border-color:var(--blue);color:white}
.notice{background:white;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 6px #0b1e3710}
.muted{color:var(--muted)}
.small{font-size:12px}
.loading,.empty{text-align:center;padding:24px;color:var(--muted)}
.league-group{background:#fff;border-radius:12px;margin:11px 0;overflow:hidden;box-shadow:0 2px 6px #0b1e370c}
.league-head{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#f9fbfe;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer;list-style:none}
.league-head::-webkit-details-marker{display:none}
.league-head:after{content:'⌄';margin-left:auto;color:var(--muted);font-size:18px}
.league-group[open]>.league-head:after{content:'⌃'}
.league-name{flex:1}
.league-count{font-size:11px;color:var(--muted);font-weight:600}
.match{padding:13px 12px;border-bottom:1px solid #edf0f5}
.match:last-child{border-bottom:0}
.match-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:10px}
.live-pill{color:var(--red);font-weight:800}
.teams{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:8px;align-items:center}
.team{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.team.away{text-align:right}
.score{text-align:center;font-size:19px;font-weight:800;white-space:nowrap}
.table-wrap{overflow-x:auto}
.standings{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.standings th,.standings td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.standings th{background:#f0f5ff}
.standings td:first-child,.standings th:first-child{text-align:center}
.retry{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 14px;margin-top:10px;font-size:14px;font-weight:700}
details.tech{margin-top:12px}
details.tech pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}
@media(min-width:650px){main{padding:20px}.match{padding:15px 18px}.team{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="ball">⚽</div>
    <div><h1>FootScore CI</h1><p>Les scores et matchs de football</p></div>
  </div>
</header>
<main>
<nav class="tabs" aria-label="Rubriques">
  <button class="active" data-tab="matches" onclick="loadTab('matches')">Aujourd'hui</button>
  <button data-tab="live-details" onclick="loadTab('live-details')">🔴 Direct</button>
  <button data-tab="standings" onclick="loadTab('standings')">Classements</button>
</nav>
<div id="content" aria-live="polite"><div class="notice loading">Chargement des matchs…</div></div>
</main>
<script>
const BASE='https://footscore-ci-server.onrender.com';
const content=document.getElementById('content');
const labels={matches:'les matchs',"live-details":'les matchs en direct',standings:'les classements'};
const leagueOrder=['Premier League','Bundesliga','La Liga','Serie A','Ligue 1','Champions League','Europa League','Conference League'];

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pick(o,keys,f=''){
  for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];
  return f;
}
function rootOf(d){return d&&d.data!==undefined?d.data:d;}
function getMatches(d){
  const r=rootOf(d);
  if(Array.isArray(r))return r;
  for(const k of ['matches','fixtures','events','results'])if(r&&Array.isArray(r[k]))return r[k];
  if(r&&r.data&&Array.isArray(r.data.matches))return r.data.matches;
  return [];
}
function teamObj(m,side){
  return m[side]||m[side+'_team']||m[side+'Team']||{};
}
function teamName(t){
  if(typeof t==='string')return t;
  return pick(t,['name','short_name','shortName','title','team_name'],'Équipe');
}
function scoreText(m){
  const h=teamObj(m,'home'),a=teamObj(m,'away');
  const hs=pick(h,['score','goals'],pick(m,['home_score','homeScore'],null));
  const as=pick(a,['score','goals'],pick(m,['away_score','awayScore'],null));
  return hs===null||as===null?'—':hs+' - '+as;
}
function statusText(m){
  const s=m.status;
  if(s&&typeof s==='object')return pick(s,['display','status','state','short'],'Programmé');
  return s||m.time||m.kickoff||'Programmé';
}
function isLive(m){
  const s=m.status;
  return !!(s&&typeof s==='object'&&(s.is_live||s.live))||
    /live|in.?play|1st half|2nd half|half time|mi-temps|1ère mi-temps|2ème mi-temps/i.test(String(typeof s==='object'?statusText(m):s||''));
}
function leagueName(m){
  const l=m.league||m.competition||m.tournament||m.league_name;
  return typeof l==='string'?l:pick(l,['name','title','competition_name'],'Autres matchs');
}
function rankLeague(name){
  const n=String(name).toLowerCase();
  const i=leagueOrder.findIndex(x=>n.includes(x.toLowerCase()));
  return i<0?100:i;
}
function card(m){
  const live=isLive(m);
  const time=pick(m,['kickoff','time','date','start_time'],'');
  return '<article class="match">'+
    '<div class="match-top"><span class="'+(live?'live-pill':'')+'">'+
    (live?'● EN DIRECT · ':'')+esc(statusText(m))+'</span><span>'+esc(time)+'</span></div>'+
    '<div class="teams"><div class="team">'+esc(teamName(teamObj(m,'home')))+'</div>'+
    '<div class="score">'+esc(scoreText(m))+'</div>'+
    '<div class="team away">'+esc(teamName(teamObj(m,'away')))+'</div></div></article>';
}
function renderMatches(data,liveOnly){
  let matches=getMatches(data);
  if(liveOnly)matches=matches.filter(isLive);
  if(!matches.length){
    return '<div class="notice empty">'+
      (liveOnly?'Aucun match en direct trouvé pour le moment.':'Aucun match trouvé dans la réponse du serveur.')+
      '<br><button class="retry" onclick="loadTab(currentTab)">Actualiser</button></div>';
  }
  const groups=new Map();
  for(const m of matches){
    const name=leagueName(m);
    if(!groups.has(name))groups.set(name,[]);
    groups.get(name).push(m);
  }
  const sorted=[...groups.entries()].sort((a,b)=>rankLeague(a[0])-rankLeague(b[0])||a[0].localeCompare(b[0],'fr'));
  return '<div class="notice"><b>'+(liveOnly?'Matchs en direct':'Matchs du jour')+
    '</b><div class="muted small">'+matches.length+' match(s) · '+groups.size+' compétition(s)</div></div>'+
    sorted.map(([name,items],i)=>'<details class="league-group" '+(i<3?'open':'')+'>'+
    '<summary class="league-head"><span class="league-name">'+esc(name)+'</span>'+
    '<span class="league-count">'+items.length+' match(s)</span></summary>'+
    items.map(card).join('')+'</details>').join('');
}
function findRows(data){
  const r=rootOf(data);
  if(Array.isArray(r))return r;
  for(const k of ['standings','table','rankings','groups','results']){
    if(r&&Array.isArray(r[k])){
      const a=r[k];
      if(a.length&&(a[0].team||a[0].name||a[0].position||a[0].rank))return a;
      for(const item of a){
        if(item&&Array.isArray(item.table))return item.table;
        if(item&&Array.isArray(item.standings))return item.standings;
      }
    }
  }
  if(r&&r.data&&Array.isArray(r.data.standings))return r.data.standings;
  return [];
}
function renderStandings(data){
  const rows=findRows(data);
  if(!rows.length)return '<div class="notice empty"><b>Classement indisponible</b>'+
    '<p class="small">Le serveur ou le fournisseur ne renvoie pas de tableau exploitable pour le moment.</p>'+
    '<details class="tech"><summary>Voir la réponse technique</summary><pre>'+esc(JSON.stringify(data,null,2))+'</pre></details>'+
    '<button class="retry" onclick="loadTab(\\'standings\\')">Actualiser</button></div>';
  return '<div class="notice"><b>Classements</b><div class="muted small">'+rows.length+
    ' équipe(s)</div></div><div class="table-wrap"><table class="standings"><thead><tr>'+
    '<th>#</th><th>Équipe</th><th>MJ</th><th>V</th><th>N</th><th>D</th><th>Pts</th></tr></thead><tbody>'+
    rows.map((r,i)=>{
      const t=r.team||r.club||{};
      return '<tr><td>'+esc(pick(r,['position','rank','place'],i+1))+'</td>'+
      '<td>'+esc(teamName(t)||pick(r,['team_name','name'],'Équipe'))+'</td>'+
      '<td>'+esc(pick(r,['played','matches_played','mp'],'—'))+'</td>'+
      '<td>'+esc(pick(r,['won','wins','w'],'—'))+'</td>'+
      '<td>'+esc(pick(r,['drawn','draws','d'],'—'))+'</td>'+
      '<td>'+esc(pick(r,['lost','losses','l'],'—'))+'</td>'+
      '<td><b>'+esc(pick(r,['points','pts'],'—'))+'</b></td></tr>';
    }).join('')+'</tbody></table></div>';
}
let currentTab='matches';
async function loadTab(path){
  currentTab=path;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===path));
  content.innerHTML='<div class="notice loading">Chargement…</div>';
  try{
    const response=await fetch(BASE+'/api/'+path,{headers:{Accept:'application/json'}});
    const text=await response.text();
    let data;
    try{data=JSON.parse(text);}catch(_){throw new Error('Le serveur a renvoyé une réponse invalide.');}
    if(!response.ok)throw new Error(pick(data,['error','message'],'Erreur HTTP '+response.status));
    if(path==='standings')content.innerHTML=renderStandings(data);
    else content.innerHTML=renderMatches(data,path==='live-details');
  }catch(e){
    content.innerHTML='<div class="notice"><b>Impossible de charger '+esc(labels[path]||'les données')+
      '</b><p class="muted">'+esc(e.message||'Vérifie la connexion Internet.')+
      '</p><button class="retry" onclick="loadTab(\\''+path+'\\')">Réessayer</button></div>';
  }
}
loadTab('matches');
</script>
</body>
</html>
